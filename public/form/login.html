<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="../css/Global.css">
        <title>Login</title>
    </head>
    <body>
        <header>
            <section>
                <h1>Responsive Registration Form</h1>
            </section>
        </header>
        
        <main>
            <section class="from-section">
                <div class="form-class">
                    <form action="#" method="post">
                        <div class="first-class">
                            <label for="first-name"><i class="fa-solid fa-user"></i></label>
                            <input id="first-name" type="text" placeholder="First Name" name="first_name" minlength="5"
                                   required>
                        </div>
                        <br>
                        <div class="last-class">
                            <label for="last-name"><i class="fa-solid fa-user"></i></label>
                            <input id="last-name" type="text" placeholder="Last Name" name="last name" minlength="3"
                                   required>
                        </div>
                        <br>
                        <div class="email-class">
                            <label for="email"><i class="fa-solid fa-envelope"></i></label>
                            <input id="email" type="email" placeholder="Email" name="Email" required>
                        </div>
                        <br>
                        <div class="pass-class">
                            <label for="pass"><i class="fa-solid fa-lock"></i></label>
                            <input id="pass" type="password" placeholder="password" name="password" required>
                        </div>
                        <br>
                        <div>
                            <input id="male" type="radio" name="gander" value="male" required>
                            <label for="male"><i class="fa-solid fa-person"></i> Male</label>
                            <input id="female" type="radio" name="gander" value="female" readonly>
                            <label for="female"><i class="fa-solid fa-person-dress"></i>Female</label>
                        </div>
                        <div>
                            <label for="country"><i class="fa-solid fa-map-location"></i> </label>
                            <select id="country" name="country">
                                <option value="">Select your country</option>
                                <option value="argentina">Argentina</option>
                                <option value="bangladesh">Bangladesh</option>
                                <option value="canada">Canada</option>
                                <option value="denmark">Denmark</option>
                                <option value="egypt">Egypt</option>
                                <option value="france">France</option>
                                <option value="germany">Germany</option>
                                <option value="hungary">Hungary</option>
                                <option value="india">India</option>
                                <option value="japan">Japan</option>
                                <option value="korea">Korea</option>
                                <option value="libya">Libya</option>
                                <option value="mexico">Mexico</option>
                                <option value="nepal">Nepal</option>
                                <option value="oman">Oman</option>
                                <option value="pakistan">Pakistan</option>
                                <option value="qatar">Qatar</option>
                                <option value="russia">Russia</option>
                                <option value="serbia">Serbia</option>
                                <option value="thailand">Thailand</option>
                                <option value="ukraine">Ukraine</option>
                                <option value="vietnam">Vietnam</option>
                                <option value="wurttemberg">Wurttemberg</option>
                                <option value="yemen">Yemen</option>
                                <option value="zimbabwe">Zimbabwe</option>
                            </select>
                        </div>
                    </form>
                    <button type="submit"></button>
                </div>
            </section>
        </main>
    </body>
</html>
